# DIABA GESCOM — Nginx interne (le TLS est terminé par le proxy de bordure).
server {
    listen 8080 default_server;
    server_name _;

    # Résolution dynamique : le conteneur "app" peut être recréé (déploiement).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_fpm app:9000;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    client_max_body_size 12m;
    charset utf-8;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Le manifeste Vite n'est lu que par Laravel côté serveur.
    location = /build/manifest.json {
        return 404;
    }

    location /build/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Restauration d'une sauvegarde : seul envoi autorisé jusqu'à 100 Mo.
    location = /onboarding/restore {
        client_max_body_size 102m;
        fastcgi_pass $php_fpm;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Manifeste PWA : type absent de mime.types par défaut.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Service worker : toujours revérifié, sinon une mise à jour resterait bloquée.
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_fpm;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Aucun autre script PHP n'est exécutable.
    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
