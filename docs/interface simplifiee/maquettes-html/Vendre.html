<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Vendre en 3 gestes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A3F37}a:hover{color:#062a25}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #F1F4F3; color: #10201C; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column;">

  <!-- En-tête -->
  <div style="background: #0A3F37; color: #FFFFFF; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="Accueil.html" aria-label="Retour à l'accueil" style="width: 48px; height: 48px; border-radius: 24px; background: #0F5247; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="flex-grow: 1; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M2 3h3l2.7 12.2a1 1 0 0 0 1 .8h9.6a1 1 0 0 0 1-.8L21 7H6"></path></svg>
        Vendre
      </span>
      <button aria-label="Écouter l'aide" style="width: 48px; height: 48px; border-radius: 24px; border: 2px solid #5BE0B0; background: #0F5247; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
      </button>
    </div>
    <div style="display: flex; gap: 8px;">
      <label style="flex-grow: 1; height: 52px; background: #FFFFFF; border-radius: 16px; display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #4A5A56;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Chercher un article</span>
        <input type="search" placeholder="Chercher…" style="border: none; outline: none; font-size: 18px; flex-grow: 1; min-width: 0; background: transparent; color: #10201C;">
      </label>
      <button aria-label="Chercher en parlant" style="width: 52px; height: 52px; border-radius: 16px; border: none; background: #34B89C; color: #04201A; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
      </button>
    </div>
  </div>

  <!-- Familles -->
  <div style="display: flex; gap: 8px; padding: 12px 16px 4px; overflow-x: auto;">
    <sc-for list="{{ cats }}" as="c" hint-placeholder-count="4">
      <button onClick="{{ c.pick }}" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-size: 17px; font-weight: 700; white-space: nowrap;">{{ c.label }}</button>
    </sc-for>
  </div>

  <!-- Articles -->
  

  <!-- Panier -->
  <div style="flex-grow: 1; padding: 12px 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start;">
    <sc-for list="{{ items }}" as="item" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border-radius: 20px; border: 3px solid {{item.ring}}; overflow: hidden; display: flex; flex-direction: column;">
        <button onClick="{{ item.add }}" aria-label="Ajouter {{item.name}}" style="border: none; background: #FFFFFF; padding: 0; text-align: left; display: flex; flex-direction: column; color: #10201C;">
          <span style="height: 84px; width: 100%; background: {{item.tint}}; color: {{item.ink}}; display: flex; align-items: center; justify-content: center; position: relative;">
            <sc-if value="{{ item.isPaw }}" hint-placeholder-val="{{ true }}">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="7" cy="9" r="2"></circle><circle cx="12" cy="6" r="2"></circle><circle cx="17" cy="9" r="2"></circle><path d="M8 17c0-3 2-5 4-5s4 2 4 5a2 2 0 0 1-2 2h-4a2 2 0 0 1-2-2z"></path></svg>
            </sc-if>
            <sc-if value="{{ item.isEgg }}" hint-placeholder-val="{{ false }}">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c-4 0-7 6-7 11a7 7 0 0 0 14 0c0-5-3-11-7-11z"></path></svg>
            </sc-if>
            <sc-if value="{{ item.isSack }}" hint-placeholder-val="{{ false }}">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-2 4h-4z"></path><path d="M10 7c-4 2-6 6-6 9a5 5 0 0 0 5 5h6a5 5 0 0 0 5-5c0-3-2-7-6-9"></path></svg>
            </sc-if>
            <sc-if value="{{ item.isLeaf }}" hint-placeholder-val="{{ false }}">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15"></path><path d="M5 19l7-7"></path></svg>
            </sc-if>
            <sc-if value="{{ item.isDrop }}" hint-placeholder-val="{{ false }}">
              <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"></path></svg>
            </sc-if>
            <span style="position: absolute; left: 8px; top: 8px; font-size: 12px; font-weight: 700; background: #FFFFFF; color: #4A5A56; border-radius: 6px; padding: 2px 6px;">photo</span>
            <sc-if value="{{ item.has }}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; right: 8px; top: 8px; min-width: 36px; height: 36px; border-radius: 18px; background: #0A3F37; color: #FFFFFF; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{ item.q }}</span>
            </sc-if>
          </span>
          <span style="padding: 8px 12px 2px; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ item.name }}</span>
          <span style="padding: 0 12px 10px; font-size: 20px; font-weight: 800; color: #0A3F37;">{{ item.priceLabel }}</span>
        </button>
        <sc-if value="{{ item.has }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; border-top: 1px solid #D5DEDB;">
            <button onClick="{{ item.sub }}" aria-label="Enlever un {{item.name}}" style="flex-grow: 1; height: 44px; border: none; background: #FCE3DE; color: #A0261E; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
            </button>
            <button onClick="{{ item.add }}" aria-label="Ajouter un {{item.name}}" style="flex-grow: 1; height: 44px; border: none; background: #E3F6F0; color: #0A3F37; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
            </button>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div><div style="background: #FFFFFF; border-top: 1px solid #D5DEDB; padding: 14px 16px 20px;">
    <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}">
      <div style="height: 72px; display: flex; align-items: center; gap: 12px; color: #4A5A56;">
        <span style="width: 52px; height: 52px; border-radius: 26px; background: #E3F6F0; color: #0A3F37; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a2 2 0 0 1 4 0v6"></path><path d="M13 9a2 2 0 0 1 4 0v3"></path><path d="M17 11a2 2 0 0 1 4 0v4a7 7 0 0 1-7 7h-1a7 7 0 0 1-6-3l-3-5a2 2 0 0 1 3-2l2 2"></path></svg>
        </span>
        <span style="font-size: 18px; font-weight: 600;">Touchez un article pour l'ajouter</span>
      </div>
    </sc-if>
    <sc-if value="{{ notEmpty }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 12px;">
        <div style="flex-grow: 1; display: flex; flex-direction: column;">
          <span style="font-size: 16px; font-weight: 600; color: #4A5A56;">{{ countLabel }}</span>
          <span style="font-size: 32px; font-weight: 800;">{{ totalLabel }}</span>
        </div>
        <button onClick="{{ goPay }}" style="height: 72px; padding: 0 22px; border-radius: 20px; border: none; background: #34B89C; color: #04201A; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 10px;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
          Encaisser
        </button>
      </div>
    </sc-if>
  </div>

  <!-- Choix du paiement -->
  <sc-if value="{{ showPay }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(6, 20, 17, 0.6); display: flex; flex-direction: column; justify-content: flex-end;">
      <div style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 12px;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 20px; font-weight: 700; color: #4A5A56;">Le client paie comment ?</span>
          <button aria-label="Écouter" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: #E3F6F0; color: #0A3F37; display: flex; align-items: center; justify-content: center;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg>
          </button>
        </div>
        <span style="font-size: 40px; font-weight: 800;">{{ totalLabel }}</span>
        <button onClick="{{ payCash }}" style="height: 76px; border-radius: 20px; border: none; background: #34B89C; color: #04201A; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 14px; padding: 0 18px;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle><path d="M6 12h.01M18 12h.01"></path></svg>
          Espèces
        </button>
        <button onClick="{{ payMobile }}" style="height: 76px; border-radius: 20px; border: none; background: #2563C9; color: #FFFFFF; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 14px; padding: 0 18px;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"></rect><path d="M11 18h2"></path></svg>
          Téléphone
        </button>
        <button onClick="{{ payCredit }}" style="height: 76px; border-radius: 20px; border: none; background: #F2A93B; color: #2A1A00; font-size: 22px; font-weight: 800; display: flex; align-items: center; gap: 14px; padding: 0 18px;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
          Paiera plus tard
        </button>
        <button onClick="{{ back }}" style="height: 52px; border-radius: 16px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; font-size: 18px; font-weight: 700;">Retour</button>
      </div>
    </div>
  </sc-if>

  <!-- Vente faite -->
  <sc-if value="{{ showOk }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: #0A3F37; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center;">
      <span style="width: 140px; height: 140px; border-radius: 70px; background: #5BE0B0; color: #04201A; display: flex; align-items: center; justify-content: center;">
        <svg width="84" height="84" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      </span>
      <span style="font-size: 30px; font-weight: 800;">Vente faite</span>
      <span style="font-size: 44px; font-weight: 800;">{{ totalLabel }}</span>
      <span style="font-size: 18px; color: #BFE6DC;">{{ payLabel }}</span>
      <div style="display: flex; flex-direction: column; gap: 12px; width: 100%; margin-top: 12px;">
        <button style="height: 64px; border-radius: 20px; border: 2px solid #5BE0B0; background: #0F5247; color: #FFFFFF; font-size: 20px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
          Ticket
        </button>
        <button onClick="{{ reset }}" style="height: 72px; border-radius: 20px; border: none; background: #34B89C; color: #04201A; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px;">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
          Nouvelle vente
        </button>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { qty: {}, step: 'panier', pay: '', cat: 'tout' };
  }
  renderVals() {
    var self = this;
    var fmt = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F'; };
    var P = [
      { id: 'lapin', name: 'Lapin', price: 5000, tint: '#F6E7D3', ink: '#6B4300', icon: 'paw', cat: 'animaux' },
      { id: 'poulet', name: 'Poulet', price: 3500, tint: '#FCE3DE', ink: '#8A2A1F', icon: 'paw', cat: 'animaux' },
      { id: 'oeufs', name: 'Œufs (plateau)', price: 2750, tint: '#FFF1D6', ink: '#6B4300', icon: 'egg', cat: 'oeufs' },
      { id: 'aliment', name: 'Aliment 50 kg', price: 14000, tint: '#E7EEF9', ink: '#173E80', icon: 'sack', cat: 'aliments' },
      { id: 'fourrage', name: 'Fourrage', price: 1500, tint: '#E3F6F0', ink: '#0A3F37', icon: 'leaf', cat: 'aliments' },
      { id: 'lait', name: 'Lait 1 L', price: 800, tint: '#EDF2F7', ink: '#2B3A55', icon: 'drop', cat: 'oeufs' }
    ];
    var qty = this.state.qty;
    var setQ = function (id, d) {
      var next = Object.assign({}, self.state.qty);
      next[id] = Math.max(0, (next[id] || 0) + d);
      self.setState({ qty: next });
    };
    var total = 0, count = 0;
    P.forEach(function (p) { var q = qty[p.id] || 0; total += q * p.price; count += q; });
    var cat = this.state.cat;
    var items = P.filter(function (p) { return cat === 'tout' || p.cat === cat; }).map(function (p) {
      var q = qty[p.id] || 0;
      return Object.assign({}, p, {
        q: q, has: q > 0, priceLabel: fmt(p.price), ring: q > 0 ? '#1E9C80' : '#FFFFFF',
        isPaw: p.icon === 'paw', isEgg: p.icon === 'egg', isSack: p.icon === 'sack', isLeaf: p.icon === 'leaf', isDrop: p.icon === 'drop',
        add: function () { setQ(p.id, 1); }, sub: function () { setQ(p.id, -1); }
      });
    });
    var cats = [['tout', 'Tout'], ['animaux', 'Animaux'], ['oeufs', 'Œufs et lait'], ['aliments', 'Aliments']].map(function (c) {
      var on = c[0] === cat;
      return { label: c[1], bg: on ? '#0A3F37' : '#FFFFFF', fg: on ? '#FFFFFF' : '#10201C', border: on ? '#0A3F37' : '#D5DEDB', pick: function () { self.setState({ cat: c[0] }); } };
    });
    var step = this.state.step;
    var payTo = function (label) { return function () { self.setState({ step: 'ok', pay: label }); }; };
    return {
      items: items, cats: cats,
      empty: count === 0, notEmpty: count > 0,
      countLabel: count + (count > 1 ? ' articles' : ' article'),
      totalLabel: fmt(total),
      showPay: step === 'payer', showOk: step === 'ok',
      payLabel: this.state.pay,
      goPay: function () { self.setState({ step: 'payer' }); },
      back: function () { self.setState({ step: 'panier' }); },
      payCash: payTo('Payé en espèces'),
      payMobile: payTo('Payé par téléphone'),
      payCredit: payTo('À crédit : le client paiera plus tard'),
      reset: function () { self.setState({ qty: {}, step: 'panier', pay: '' }); }
    };
  }
}
</script>
</body>
</html>
