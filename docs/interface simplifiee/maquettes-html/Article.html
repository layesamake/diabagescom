<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ajouter un article</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A3F37}a:hover{color:#062a25}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 1060px; position: relative; overflow: hidden; background: #F1F4F3; color: #10201C; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="background: #0A3F37; color: #FFFFFF; padding: 12px 16px; display: flex; align-items: center; gap: 12px;">
    <a href="Stock.html" aria-label="Retour" style="width: 48px; height: 48px; border-radius: 24px; background: #0F5247; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <span style="flex-grow: 1; font-size: 24px; font-weight: 800;">Nouvel article</span>
    <button aria-label="Écouter l'aide" style="width: 48px; height: 48px; border-radius: 24px; border: 2px solid #5BE0B0; background: #0F5247; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M19 5a10 10 0 0 1 0 14"></path></svg>
    </button>
  </div>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 16px;">

    <!-- 1. Photo -->
    <div style="display: flex; gap: 10px;">
      <button style="flex-grow: 1; height: 148px; border-radius: 22px; border: 3px dashed #34B89C; background: #E3F6F0; color: #0A3F37; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;">
        <span style="width: 72px; height: 72px; border-radius: 36px; background: #34B89C; color: #04201A; display: flex; align-items: center; justify-content: center;">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        </span>
        <span style="font-size: 20px; font-weight: 800;">Prendre la photo</span>
      </button>
      <button aria-label="Choisir dans la galerie" style="width: 84px; height: 148px; border-radius: 22px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #4A5A56; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 700;">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
        Galerie
      </button>
    </div>

    <!-- 2. Nom -->
    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 18px; font-weight: 800;">Nom</span>
      <span style="display: flex; gap: 8px;">
        <input type="text" value="Case caille 2 niveaux" style="flex-grow: 1; min-width: 0; height: 60px; border-radius: 16px; border: 2px solid #D5DEDB; background: #FFFFFF; padding: 0 14px; font-size: 20px; color: #10201C;">
        <button aria-label="Dire le nom" style="width: 60px; height: 60px; border-radius: 16px; border: none; background: #34B89C; color: #04201A; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
        </button>
      </span>
    </label>

    <!-- 3. Prix -->
    <label style="display: flex; flex-direction: column; gap: 6px;">
      <span style="font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#0A3F37" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
        Prix de vente
      </span>
      <span style="height: 72px; border-radius: 18px; border: 3px solid #1E9C80; background: #FFFFFF; display: flex; align-items: center; padding: 0 16px; gap: 8px;">
        <input type="text" inputmode="numeric" value="80 000" style="flex-grow: 1; min-width: 0; border: none; outline: none; font-size: 34px; font-weight: 800; color: #10201C; background: transparent;">
        <span style="font-size: 26px; font-weight: 800; color: #4A5A56;">F</span>
      </span>
    </label>

    <!-- 4. Vendu par -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 18px; font-weight: 800;">Vendu par</span>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
        <button aria-pressed="true" style="height: 88px; border-radius: 18px; border: 3px solid #0A3F37; background: #E3F6F0; color: #0A3F37; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 800;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8l9-5 9 5-9 5-9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>
          Pièce
        </button>
        <button aria-pressed="false" style="height: 88px; border-radius: 18px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-2 4h-4z"></path><path d="M10 7c-4 2-6 6-6 9a5 5 0 0 0 5 5h6a5 5 0 0 0 5-5c0-3-2-7-6-9"></path></svg>
          Sac
        </button>
        <button aria-pressed="false" style="height: 88px; border-radius: 18px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l2 13H4z"></path><circle cx="12" cy="5" r="2"></circle></svg>
          Kilo
        </button>
        <button aria-pressed="false" style="height: 88px; border-radius: 18px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s-6 7-6 11a6 6 0 0 0 12 0c0-4-6-11-6-11z"></path></svg>
          Litre
        </button>
        <button aria-pressed="false" style="height: 88px; border-radius: 18px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="8" cy="10" r="1.5"></circle><circle cx="12" cy="10" r="1.5"></circle><circle cx="16" cy="10" r="1.5"></circle><circle cx="8" cy="14.5" r="1.5"></circle><circle cx="12" cy="14.5" r="1.5"></circle><circle cx="16" cy="14.5" r="1.5"></circle></svg>
          Plateau
        </button>
        <button aria-pressed="false" style="height: 88px; border-radius: 18px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: 16px; font-weight: 700;">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="1"></rect><path d="M3 7l3-4h12l3 4"></path><path d="M10 11h4"></path></svg>
          Carton
        </button>
      </div>
    </div>

    <!-- 5. Famille -->
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <span style="font-size: 18px; font-weight: 800;">Famille</span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <button aria-pressed="true" style="height: 48px; padding: 0 16px; border-radius: 999px; border: 2px solid #0A3F37; background: #0A3F37; color: #FFFFFF; font-size: 17px; font-weight: 700;">Cage caille</button>
        <button aria-pressed="false" style="height: 48px; padding: 0 16px; border-radius: 999px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; font-size: 17px; font-weight: 700;">Animaux</button>
        <button style="height: 48px; padding: 0 16px; border-radius: 999px; border: 2px dashed #B7C4C0; background: transparent; color: #4A5A56; font-size: 17px; font-weight: 700;">+ Nouvelle</button>
      </div>
    </div>

    <!-- Options cachées -->
    <button style="height: 60px; border-radius: 16px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #4A5A56; display: flex; align-items: center; gap: 10px; padding: 0 14px; text-align: left;">
      <span style="flex-grow: 1; display: flex; flex-direction: column;">
        <span style="font-size: 17px; font-weight: 700; color: #10201C;">Plus d'options</span>
        <span style="font-size: 14px;">prix d'achat, code-barres, TVA, référence</span>
      </span>
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </div>

  <div style="margin-top: auto; background: #FFFFFF; border-top: 1px solid #D5DEDB; padding: 14px 16px 20px;">
    <button style="width: 100%; height: 72px; border-radius: 20px; border: none; background: #34B89C; color: #04201A; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      Enregistrer
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
