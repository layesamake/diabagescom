<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Clients et crédit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0A3F37}a:hover{color:#062a25}
button,input{font-family:inherit}
button{cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 900px; position: relative; overflow: hidden; background: #F1F4F3; color: #10201C; font-family: 'Atkinson Hyperlegible Next', 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column;">

  <div style="background: #0A3F37; color: #FFFFFF; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <a href="Accueil.html" aria-label="Retour à l'accueil" style="width: 48px; height: 48px; border-radius: 24px; background: #0F5247; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </a>
      <span style="flex-grow: 1; font-size: 26px; font-weight: 800; display: flex; align-items: center; gap: 10px;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="4"></circle><path d="M2 21c0-4 3-7 7-7s7 3 7 7"></path><path d="M16 4a4 4 0 0 1 0 8"></path><path d="M22 21c0-3-1.5-5.5-4-6.5"></path></svg>
        Clients
      </span>
      <button aria-label="Chercher en parlant" style="width: 48px; height: 48px; border-radius: 24px; border: none; background: #34B89C; color: #04201A; display: flex; align-items: center; justify-content: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>
      </button>
    </div>
    <button onClick="{{ toggleDebt }}" style="border: 3px solid {{debtRing}}; background: #F2A93B; color: #2A1A00; border-radius: 20px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; text-align: left;">
      <span style="width: 52px; height: 52px; border-radius: 26px; background: #FFF1D6; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
      </span>
      <span style="flex-grow: 1; display: flex; flex-direction: column;">
        <span style="font-size: 16px; font-weight: 700;">On me doit</span>
        <span style="font-size: 30px; font-weight: 800;">{{ totalDebt }}</span>
      </span>
      <span style="font-size: 16px; font-weight: 800; background: #FFF1D6; border-radius: 999px; padding: 6px 12px;">{{ debtCount }}</span>
    </button>
  </div>

  <div style="flex-grow: 1; padding: 14px 16px 110px; display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{ clients }}" as="c" hint-placeholder-count="6">
      <div style="background: #FFFFFF; border-radius: 20px; padding: 10px 12px; display: flex; align-items: center; gap: 12px;">
        <button onClick="{{ c.open }}" style="flex-grow: 1; min-width: 0; border: none; background: none; padding: 0; display: flex; align-items: center; gap: 12px; text-align: left; color: #10201C;">
          <span style="width: 56px; height: 56px; border-radius: 28px; background: {{c.bg}}; color: #FFFFFF; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{ c.initials }}</span>
          <span style="min-width: 0; display: flex; flex-direction: column; gap: 2px;">
            <span style="font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ c.name }}</span>
            <sc-if value="{{ c.owes }}" hint-placeholder-val="{{ true }}">
              <span style="font-size: 20px; font-weight: 800; color: #7A4B00;">doit {{ c.debtLabel }}</span>
            </sc-if>
            <sc-if value="{{ c.clear }}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 16px; font-weight: 700; color: #1E7A64; display: flex; align-items: center; gap: 4px;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
                ne doit rien
              </span>
            </sc-if>
          </span>
        </button>
        <a href="tel:+221000000000" aria-label="Appeler {{c.name}}" style="width: 52px; height: 52px; border-radius: 26px; background: #E3F6F0; color: #0A3F37; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"></path></svg>
        </a>
      </div>
    </sc-for>
  </div>

  <button style="position: absolute; left: 16px; right: 16px; bottom: 20px; height: 72px; border-radius: 22px; border: none; background: #6D3FB8; color: #FFFFFF; font-size: 22px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 12px;">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Nouveau client
  </button>

  <!-- Fiche client -->
  <sc-if value="{{ showSheet }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 0; bottom: 0; background: rgba(6, 20, 17, 0.6); display: flex; flex-direction: column; justify-content: flex-end;">
      <div style="background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 20px 16px 24px; display: flex; flex-direction: column; gap: 12px; align-items: stretch;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <span style="width: 72px; height: 72px; border-radius: 36px; background: {{sel.bg}}; color: #FFFFFF; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">{{ sel.initials }}</span>
          <span style="display: flex; flex-direction: column; gap: 2px; min-width: 0;">
            <span style="font-size: 22px; font-weight: 800;">{{ sel.name }}</span>
            <span style="font-size: 17px; color: #4A5A56;">{{ sel.phone }}</span>
          </span>
        </div>
        <sc-if value="{{ sel.owes }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 12px;">
            <div style="background: #FFF1D6; border-radius: 18px; padding: 14px; display: flex; align-items: baseline; justify-content: space-between;">
              <span style="font-size: 18px; font-weight: 700; color: #6B4300;">Doit encore</span>
              <span style="font-size: 34px; font-weight: 800; color: #6B4300;">{{ sel.debtLabel }}</span>
            </div>
            <button onClick="{{ payAll }}" style="height: 72px; border-radius: 20px; border: none; background: #34B89C; color: #04201A; font-size: 21px; font-weight: 800; display: flex; align-items: center; gap: 12px; padding: 0 18px;">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><circle cx="12" cy="12" r="2.5"></circle></svg>
              Il paie tout
            </button>
            <span style="font-size: 17px; font-weight: 700; color: #4A5A56;">Il paie une partie :</span>
            <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
              <button onClick="{{ pay1000 }}" style="height: 60px; border-radius: 16px; border: 2px solid #B9C9F0; background: #E7EEF9; color: #173E80; font-size: 19px; font-weight: 800;">1 000</button>
              <button onClick="{{ pay2000 }}" style="height: 60px; border-radius: 16px; border: 2px solid #B9C9F0; background: #E7EEF9; color: #173E80; font-size: 19px; font-weight: 800;">2 000</button>
              <button onClick="{{ pay5000 }}" style="height: 60px; border-radius: 16px; border: 2px solid #B9C9F0; background: #E7EEF9; color: #173E80; font-size: 19px; font-weight: 800;">5 000</button>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ sel.clear }}" hint-placeholder-val="{{ false }}">
          <div style="background: #E3F6F0; border-radius: 18px; padding: 18px; display: flex; align-items: center; gap: 12px; color: #0A3F37;">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
            <span style="font-size: 22px; font-weight: 800;">Ne doit rien</span>
          </div>
        </sc-if>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
          <button style="height: 56px; border-radius: 16px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>
            Ses achats
          </button>
          <button onClick="{{ close }}" style="height: 56px; border-radius: 16px; border: 2px solid #D5DEDB; background: #FFFFFF; color: #10201C; font-size: 17px; font-weight: 700;">Fermer</button>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { onlyDebt: false, sel: '', debt: { ad: 12000, mn: 6500, fs: 0, if: 0, md: 0, ob: 0 } };
  }
  renderVals() {
    var self = this;
    var fmt = function (n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + ' F'; };
    var C = [
      { id: 'ad', name: 'Aïssatou Diop', initials: 'AD', bg: '#B5602C', phone: '77 000 00 01' },
      { id: 'mn', name: 'Moussa Ndiaye', initials: 'MN', bg: '#2F5E9E', phone: '77 000 00 02' },
      { id: 'fs', name: 'Fatou Sarr', initials: 'FS', bg: '#6D3FB8', phone: '78 000 00 03' },
      { id: 'if', name: 'Ibrahima Fall', initials: 'IF', bg: '#2E7D57', phone: '76 000 00 04' },
      { id: 'md', name: 'Mame Diarra Sow', initials: 'MS', bg: '#A0261E', phone: '77 000 00 05' },
      { id: 'ob', name: 'Ousmane Ba', initials: 'OB', bg: '#4A5A56', phone: '70 000 00 06' }
    ];
    var debt = this.state.debt;
    var setDebt = function (id, v) {
      var next = Object.assign({}, self.state.debt); next[id] = Math.max(0, v); self.setState({ debt: next });
    };
    var view = function (c) {
      var d = debt[c.id] || 0;
      return Object.assign({}, c, { owes: d > 0, clear: d === 0, debtLabel: fmt(d), open: function () { self.setState({ sel: c.id }); } });
    };
    var total = 0, n = 0;
    C.forEach(function (c) { if (debt[c.id] > 0) { total += debt[c.id]; n++; } });
    var only = this.state.onlyDebt;
    var list = C.filter(function (c) { return !only || debt[c.id] > 0; })
      .sort(function (a, b) { return (debt[b.id] || 0) - (debt[a.id] || 0); })
      .map(view);
    var selC = C.filter(function (c) { return c.id === self.state.sel; })[0];
    var sel = selC ? view(selC) : { name: '', initials: '', bg: '#4A5A56', phone: '', owes: false, clear: false, debtLabel: '' };
    var pay = function (amt) { return function () { if (selC) setDebt(selC.id, (debt[selC.id] || 0) - amt); }; };
    return {
      clients: list,
      totalDebt: fmt(total),
      debtCount: n + (n > 1 ? ' clients' : ' client'),
      debtRing: only ? '#FFFFFF' : '#F2A93B',
      toggleDebt: function () { self.setState({ onlyDebt: !only }); },
      showSheet: !!selC, sel: sel,
      payAll: function () { if (selC) setDebt(selC.id, 0); },
      pay1000: pay(1000), pay2000: pay(2000), pay5000: pay(5000),
      close: function () { self.setState({ sel: '' }); }
    };
  }
}
</script>
</body>
</html>
