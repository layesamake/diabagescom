name: ci

on:
  push:
    branches-ignore:
      - main # main est testé par deploy.yml avant publication
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Qualité, tests et build frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: diaba_testing
          POSTGRES_USER: diaba
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U diaba -d diaba_testing"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: diaba
      DB_PASSWORD: ci-only-password
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, intl, pcntl, pdo_pgsql, pgsql, redis, zip
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies (locked)
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install JS dependencies (locked)
        run: npm ci --no-audit --no-fund

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan wayfinder:generate --with-form

      - name: Dependency audit
        run: |
          composer audit --no-interaction
          npm audit --omit=dev --audit-level=high

      - name: PHP format (Pint)
        run: vendor/bin/pint --test

      - name: PHP static analysis (PHPStan)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: JS format and lint
        run: npm run check

      - name: TypeScript
        run: npm run types:check

      - name: JS unit tests (offline/PWA isolation)
        run: npm run test:js

      - name: Frontend build
        run: npm run build

      - name: Tests (PostgreSQL)
        run: php artisan test

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build application image
        run: >
          docker build -f docker/php/Dockerfile --target app
          --build-arg APP_VERSION=${{ github.sha }}
          -t diaba-gescom:${{ github.sha }} .

      - name: Build nginx image
        run: >
          docker build -f docker/php/Dockerfile --target nginx
          -t diaba-gescom-nginx:${{ github.sha }} .

      - name: Image contains no secrets
        run: |
          docker run --rm --entrypoint sh diaba-gescom:${{ github.sha }} -c \
            'test ! -e .env && test ! -e auth.json && ! ls storage/*.key 2>/dev/null'
