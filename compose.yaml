# DIABA GESCOM — environnement de développement LOCAL.
# Les serveurs (dev.diaba.cloud, diaba.cloud) utilisent deploy/compose.yaml.
#
#   cp .env.example .env      # puis renseigner les mots de passe locaux
#   docker compose up -d
#   docker compose exec app composer setup:docker
#
# Ports exposés uniquement sur 127.0.0.1.

name: diaba

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: diaba-gescom:dev
  volumes:
    - .:/var/www/html
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD", "php-fpm-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--max-time=3600"]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]

  nginx:
    image: nginx:1.29-alpine
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8080"
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  vite:
    image: diaba-gescom:dev
    command: ["npm", "run", "dev"]
    environment:
      VITE_IN_DOCKER: "1"
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    ports:
      - "127.0.0.1:${VITE_PORT:-5173}:5173"
    depends_on:
      - app
    profiles: ["vite"]

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      DIABA_TEST_DATABASE: ${DB_TEST_DATABASE:-diaba_testing}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-54320}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
